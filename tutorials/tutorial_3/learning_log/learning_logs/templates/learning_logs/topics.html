{% extends 'learning_logs/base.html' %}

{% block page_header %}
    <h1>Topics</h1>
{% endblock page_header %}

{% block content %}

    <ul class="list-group border-bottom pb-2 mb-4">
        {% for topic in topics %}
            <li class="list-group-item">
                <h5><a href="{% url 'learning_logs:topic' topic.id %}">
                    {{ topic.text }}</a></h5>
            </li>
        {% empty %}
            <li class="list-group-item">No topics have been added yet.</li>
        {% endfor %}
    </ul>

    <h4><a href="{% url 'learning_logs:new_topic' %}">Add a new topic</a></h4>

{% endblock content %}
